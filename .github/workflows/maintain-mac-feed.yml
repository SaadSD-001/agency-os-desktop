name: Keep Mac updates available on Windows releases
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Latest stable release to inspect
        required: true
permissions:
  contents: write
concurrency:
  group: maintain-mac-feed
  cancel-in-progress: false
jobs:
  preserve:
    if: github.repository == 'SaadSD-001/agency-os-desktop' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Carry forward the most recent verified Mac feed if needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: ruby .github/carry-mac-feed.rb
